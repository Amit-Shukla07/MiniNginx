<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MiniNginx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <h1>MiniNginx</h1>
        <p class="subtitle">A small HTTP/1.1 server written in C++20.</p>
        <p>This page is being served by MiniNginx using non-blocking I/O multiplexing.</p>

        <div class="diagram">
            <h3>Request Flow</h3>
            <pre>
Client
  ↓
TCP Socket
  ↓
kqueue (macOS) / epoll (Linux)
  ↓
Event Loop
  ↓
HTTP Parser
  ↓
Static File
  ↓
Response
            </pre>
        </div>

        <p><a href="test.html">Test secondary page</a></p>
    </div>
</body>
</html>
