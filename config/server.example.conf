# MiniNginx Example Configuration
server {
    # Network binding
    host 0.0.0.0;
    port 8080;

    # Static document root
    root ./public;

    # Worker concurrency (1 for single event loop, N for multi-worker)
    workers 4;

    # Timeouts in seconds
    keep_alive_timeout 60;
    request_timeout 15;

    # Security & resource bounds
    max_connections 10000;
    max_header_size 65536;
    max_body_size 10485760;

    # Observability & logging
    access_log ./logs/access.log;
    error_log ./logs/error.log;
    log_level INFO;
}
