server {
    host 0.0.0.0;
    port 8080;

    root ./public;

    workers 2;

    keep_alive_timeout 60;
    request_timeout 10;

    max_connections 10000;
    max_header_size 65536;
    max_body_size 10485760;

    access_log ./logs/access.log;
    error_log ./logs/error.log;
    log_level INFO;
}
